<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log In — COGNISPHERE.AI</title>
  <meta name="description" content="Sign in or create an account for Cognisphere.ai — Superhuman Autonomous Intelligence & AI Studio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg' fill='none'%3E%3Cpath d='M 6 16 A 10 10 0 1 0 26 16' stroke='%2300ffaa' stroke-width='2' stroke-linecap='round'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.5' transform='rotate(-30 16 16)' stroke='%23e8c9a0' stroke-width='1.4' opacity='0.85'/%3E%3Ccircle cx='7' cy='12' r='1.8' fill='%2300ffaa'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070809;
      --neon: #00ffaa;
      --gold: #D97757;
      --text: #F0EDE8;
      --muted: #8c8780;
      --line: rgba(255,255,255,0.1);
    }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      display: flex; flex-direction: column;
    }

    #bgCanvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px;
      background: rgba(7,8,9,0.75); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .brand-logo-wrap { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon-box {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #0b1a14 0%, #08120d 100%);
      border: 1.5px solid rgba(0,255,170,0.5);
      box-shadow: 0 0 14px rgba(0,255,170,0.25);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title {
      font-family: 'Spectral', Georgia, serif;
      font-size: 1.15rem; font-weight: 800; color: #ffffff;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    .main-container {
      position: relative; z-index: 10;
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 90px 20px 40px;
    }

    .auth-card-wrap {
      position: relative; width: 100%; max-width: 460px;
    }

    .auth-aurora-glow {
      position: absolute; top: -25px; left: -25px; right: -25px; bottom: -25px;
      background: radial-gradient(circle at 50% 20%, rgba(0, 255, 170, 0.25) 0%, rgba(217, 119, 87, 0.18) 45%, transparent 70%);
      filter: blur(35px); border-radius: 36px; z-index: 0; pointer-events: none;
      animation: authAuroraPulse 4s ease-in-out infinite alternate;
    }
    @keyframes authAuroraPulse {
      0% { opacity: 0.5; transform: scale(0.96); }
      100% { opacity: 0.95; transform: scale(1.03); }
    }

    .auth-card {
      position: relative; z-index: 1;
      background: linear-gradient(160deg, rgba(16, 21, 28, 0.96) 0%, rgba(8, 11, 15, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 24px;
      padding: 36px 30px 30px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 255, 170, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .auth-head { text-align: center; margin-bottom: 22px; }

    .auth-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(0, 255, 170, 0.08); border: 1px solid rgba(0, 255, 170, 0.28);
      color: var(--neon); font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
    }
    .auth-badge-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--neon);
      box-shadow: 0 0 8px var(--neon); animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .auth-brand-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #0f251c 0%, #08120d 100%);
      border: 1.5px solid rgba(0, 255, 170, 0.45);
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.3), inset 0 0 12px rgba(0, 255, 170, 0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px;
    }

    .auth-title-gradient {
      font-family: 'Spectral', Georgia, serif; font-size: 1.45rem; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #00ffaa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.02em; margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 0.82rem; color: var(--muted);
      letter-spacing: 0.01em; line-height: 1.35;
    }

    .auth-tabs {
      display: flex; background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px; padding: 4px; margin-bottom: 18px;
    }
    .auth-tab {
      flex: 1; text-align: center; background: transparent; border: none;
      color: var(--muted); font-size: 0.82rem; font-weight: 600;
      padding: 8px 12px; border-radius: 9px; cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-tab:hover { color: #fff; }
    .auth-tab.active {
      background: rgba(255, 255, 255, 0.12); color: #fff; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .soc-btn-hero {
      width: 100%; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.18); color: #ffffff;
      padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); margin-bottom: 10px;
    }
    .soc-btn-hero:hover {
      background: rgba(255, 255, 255, 0.1); border-color: rgba(66, 133, 244, 0.65);
      transform: translateY(-1.5px);
      box-shadow: 0 8px 24px rgba(66, 133, 244, 0.22), 0 0 15px rgba(66, 133, 244, 0.15);
    }
    .soc-btn-hero-left { display: flex; align-items: center; gap: 10px; }
    .soc-btn-badge {
      font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
      padding: 3px 8px; border-radius: 6px;
      background: rgba(66, 133, 244, 0.2); border: 1px solid rgba(66, 133, 244, 0.4);
      color: #8ab4f8; letter-spacing: 0.06em;
    }

    .soc-btn-secondary {
      width: 100%; background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08); color: #c9d1d9;
      padding: 10px 16px; border-radius: 12px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .soc-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.2); color: #fff;
    }

    .auth-divider {
      display: flex; align-items: center; gap: 12px; font-size: 0.72rem; color: #737b86;
      margin: 18px 0 16px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .auth-inp-wrap { margin-bottom: 13px; text-align: left; }
    .auth-inp-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.76rem; font-weight: 600; color: #cfd3dc; margin-bottom: 6px;
    }
    .auth-input-box { position: relative; display: flex; align-items: center; }
    .auth-inp-icon {
      position: absolute; left: 13px; color: #737b86; font-size: 0.95rem; pointer-events: none;
    }
    .auth-inp {
      width: 100%; background: rgba(8, 12, 16, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.11); color: #fff;
      padding: 11px 14px 11px 38px; border-radius: 11px;
      font-size: 0.86rem; outline: none; transition: all 0.2s ease; font-family: inherit;
    }
    .auth-inp::placeholder { color: #555e6c; }
    .auth-inp:focus {
      border-color: #00ffaa; background: rgba(10, 16, 22, 0.95);
      box-shadow: 0 0 0 3px rgba(0, 255, 170, 0.16), 0 0 20px rgba(0, 255, 170, 0.12);
    }
    .auth-input-box:focus-within .auth-inp-icon { color: #00ffaa; }

    .auth-pwd-toggle {
      position: absolute; right: 12px; background: transparent; border: none;
      color: #737b86; cursor: pointer; padding: 4px; font-size: 0.85rem;
    }
    .auth-pwd-toggle:hover { color: #fff; }

    .auth-btn-primary {
      width: 100%; background: linear-gradient(135deg, #00ffaa 0%, #00d98b 50%, #00b377 100%);
      color: #05080c; border: none; padding: 12px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 10px;
      box-shadow: 0 4px 20px rgba(0, 255, 170, 0.35);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-btn-primary:hover {
      transform: translateY(-1.5px); box-shadow: 0 6px 28px rgba(0, 255, 170, 0.55);
    }

    .auth-card-footer {
      text-align: center; font-size: 0.77rem; color: #737b86; margin-top: 16px;
    }
    .auth-toggle-link {
      background: none; border: none; padding: 0; color: var(--neon);
      cursor: pointer; font-size: 0.78rem; font-weight: 700; text-decoration: underline;
    }
    .auth-toggle-link:hover { color: #fff; }

    .auth-sec-pill {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 0.68rem; color: #5a6270; margin-top: 12px;
    }

    .err-msg {
      background: rgba(248,104,104,0.1); border: 1px solid rgba(248,104,104,0.3);
      color: #ff8080; padding: 8px 12px; border-radius: 6px; font-size: 0.78rem;
      margin-bottom: 12px; display: none; text-align: left;
    }
    .err-msg.show { display: block; }
    .social-spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: soc-spin .7s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }
    @keyframes soc-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <nav>
    <a href="index.html" class="brand-logo-wrap">
      <div class="brand-icon-box">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
          <path d="M 6 16 A 10 10 0 1 0 26 16" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="16" cy="16" rx="11" ry="4.5" transform="rotate(-30 16 16)" stroke="#e8c9a0" stroke-width="1.6" opacity="0.9"/>
          <circle cx="7" cy="12" r="1.8" fill="#00ffaa"/>
          <circle cx="16" cy="16" r="3.2" fill="#ffffff"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">COGNISPHERE.AI</div>
      </div>
    </a>
    <a href="index.html" style="color:var(--muted); text-decoration:none; font-size:0.82rem; font-weight:600; display:flex; align-items:center; gap:6px;">
      <span>←</span> Back to Home
    </a>
  </nav>

  <div class="main-container">
    <div class="auth-card-wrap">
      <div class="auth-aurora-glow"></div>
      <div class="auth-card">
        <div class="auth-head">
          <div class="auth-badge">
            <span class="auth-badge-dot"></span> SECURE AUTONOMOUS CLOUD
          </div>
          <div class="auth-brand-icon">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
              <path d="M 6 16 A 10 10 0 1 0 26 16" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="round"/>
              <ellipse cx="16" cy="16" rx="11" ry="4.5" transform="rotate(-30 16 16)" stroke="#e8c9a0" stroke-width="1.6" opacity="0.9"/>
              <circle cx="7" cy="12" r="1.8" fill="#00ffaa"/>
              <circle cx="16" cy="16" r="3.2" fill="#ffffff"/>
            </svg>
          </div>
          <h2 id="authTitle" class="auth-title-gradient">Log in to Cognisphere</h2>
          <p id="authSub" class="auth-subtitle">Autonomous intelligence engine & supercluster studio</p>
        </div>

        <!-- Segmented Tabs -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tabLogin" onclick="toggleAuthMode('login')">Log in</button>
          <button type="button" class="auth-tab" id="tabRegister" onclick="toggleAuthMode('register')">Create account</button>
        </div>

        <!-- Google Hero Button -->
        <button class="soc-btn-hero social-btn" data-provider="google" type="button" onclick="handleGoogleSignIn()">
          <div class="soc-btn-hero-left">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </div>
          <span class="soc-btn-badge">Instant</span>
        </button>

        <!-- Secondary GitHub Button -->
        <button class="soc-btn-secondary social-btn" data-provider="github" type="button" onclick="socialAuth('github')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          <span>Continue with GitHub</span>
        </button>

        <div class="auth-divider"><span>or with email</span></div>
        <div class="err-msg" id="authError"></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
          <div class="auth-inp-wrap" id="nameGroup" style="display:none;">
            <label class="auth-inp-label">Full Name</label>
            <div class="auth-input-box">
              <span class="auth-inp-icon">👤</span>
              <input type="text" class="auth-inp" id="inpName" placeholder="Alex Morgan">
            </div>
          </div>
          <div class="auth-inp-wrap">
            <label class="auth-inp-label">Email Address</label>
            <div class="auth-input-box">
              <span class="auth-inp-icon">✉️</span>
              <input type="email" class="auth-inp" id="inpEmail" placeholder="name@company.com" required>
            </div>
          </div>
          <div class="auth-inp-wrap">
            <label class="auth-inp-label">
              <span>Password</span>
            </label>
            <div class="auth-input-box">
              <span class="auth-inp-icon">🔒</span>
              <input type="password" class="auth-inp" id="inpPassword" placeholder="••••••••" required minlength="6">
              <button type="button" class="auth-pwd-toggle" onclick="togglePasswordVisibility('inpPassword')" title="Show/Hide Password">👁️</button>
            </div>
          </div>
          <button type="submit" class="auth-btn-primary" id="authSubmitBtn">Log in to Workspace →</button>
        </form>

        <div class="auth-card-footer" id="authToggleText">
          New to Cognisphere? <button type="button" class="auth-toggle-link" onclick="toggleAuthMode('register')">Create an account</button>
        </div>
        <div class="auth-sec-pill">
          <span>🛡️</span> <span>Enterprise Grade • 256-Bit SSL End-to-End Encryption</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '587514151509-ffmej4mml0re8ascku86u2tnlb09tbnm.apps.googleusercontent.com';
    let authMode = 'login';

    function getApiBaseUrl() {
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') return '';
      if (window.location.port === '3088') return '';
      return 'http://127.0.0.1:3088';
    }

    function toggleAuthMode(mode) {
      authMode = mode;
      const errEl = document.getElementById('authError');
      if (errEl) errEl.classList.remove('show');

      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const nameGrp = document.getElementById('nameGroup');
      const titleEl = document.getElementById('authTitle');
      const subEl = document.getElementById('authSub');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('authToggleText');

      if (mode === 'register') {
        if (tabLogin) tabLogin.classList.remove('active');
        if (tabRegister) tabRegister.classList.add('active');
        if (titleEl) titleEl.textContent = 'Create your Account';
        if (subEl) subEl.textContent = 'Get instant access to Cognisphere autonomous studio';
        if (nameGrp) nameGrp.style.display = 'block';
        if (submitBtn) submitBtn.textContent = 'Create Account & Enter Workspace →';
        if (toggleText) toggleText.innerHTML = 'Already have an account? <button type="button" class="auth-toggle-link" onclick="toggleAuthMode(\'login\')">Log in</button>';
      } else {
        if (tabRegister) tabRegister.classList.remove('active');
        if (tabLogin) tabLogin.classList.add('active');
        if (titleEl) titleEl.textContent = 'Log in to Cognisphere';
        if (subEl) subEl.textContent = 'Autonomous intelligence engine & supercluster studio';
        if (nameGrp) nameGrp.style.display = 'none';
        if (submitBtn) submitBtn.textContent = 'Log in to Workspace →';
        if (toggleText) toggleText.innerHTML = 'New to Cognisphere? <button type="button" class="auth-toggle-link" onclick="toggleAuthMode(\'register\')">Create an account</button>';
      }
    }

    function togglePasswordVisibility(inputId) {
      const inp = document.getElementById(inputId || 'inpPassword');
      if (!inp) return;
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function resetSocialButtons() {
      document.querySelectorAll('.social-btn').forEach(b => { b.disabled = false; });
      const gBtn = document.querySelector('.social-btn[data-provider="google"]');
      const ghBtn = document.querySelector('.social-btn[data-provider="github"]');
      if (gBtn) gBtn.innerHTML = `<div class="soc-btn-hero-left"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg><span>Continue with Google</span></div><span class="soc-btn-badge">Instant</span>`;
      if (ghBtn) ghBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg><span>Continue with GitHub</span>`;
    }

    function initGoogleIdentityServices() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: true,
            context: 'signin'
          });
        } catch (e) {}
      }
    }

    function handleGoogleSignIn() {
      const errEl = document.getElementById('authError');
      if (errEl) errEl.classList.remove('show');
      const btn = document.querySelector('.social-btn[data-provider="google"]');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="social-spinner"></span> Connecting Google...`;
      }

      if (window.google && window.google.accounts && window.google.accounts.id) {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleCredentialResponse,
            auto_select: false,
            context: 'signin'
          });
          google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              socialAuth('google');
            }
          });
        } catch (e) {
          socialAuth('google');
        }
      } else {
        socialAuth('google');
      }
    }

    async function handleGoogleCredentialResponse(response) {
      const errEl = document.getElementById('authError');
      if (!response || !response.credential) {
        resetSocialButtons();
        return;
      }

      try {
        const base = getApiBaseUrl();
        const res = await fetch((base ? base : '') + '/api/auth/google/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Google authentication failed');

        localStorage.setItem('csToken', data.token);
        localStorage.setItem('csUser', JSON.stringify(data.user));

        if (errEl) {
          errEl.style.color = '#00ffaa'; errEl.style.borderColor = 'rgba(0,255,170,.3)'; errEl.style.background = 'rgba(0,255,170,.07)';
          errEl.textContent = `✅ Authenticated as ${data.user.name}! Entering workspace…`;
          errEl.classList.add('show');
        }
        setTimeout(() => { window.location.href = 'home.html'; }, 600);
      } catch (err) {
        if (errEl) {
          errEl.style.color = ''; errEl.style.borderColor = ''; errEl.style.background = '';
          errEl.textContent = err.message || 'Google sign-in failed.';
          errEl.classList.add('show');
        }
        resetSocialButtons();
      }
    }

    let _oauthPopup = null;
    let _oauthTimer = null;

    function socialAuth(provider) {
      const errEl = document.getElementById('authError');
      if (errEl) errEl.classList.remove('show');
      if (_oauthPopup && !_oauthPopup.closed) _oauthPopup.close();

      const btn = document.querySelector(`.social-btn[data-provider="${provider}"]`);
      if (btn) { btn.innerHTML = `<span class="social-spinner"></span> Connecting…`; btn.disabled = true; }

      const W = 520, H = 640;
      const left = Math.round(screen.width / 2 - W / 2);
      const top  = Math.round(screen.height / 2 - H / 2);
      const base = getApiBaseUrl();
      const url  = `${base}/api/auth/${provider}`;
      _oauthPopup = window.open(url, `cognisphere_${provider}_oauth`,
        `width=${W},height=${H},left=${left},top=${top},toolbar=no,menubar=no,scrollbars=yes,resizable=yes`);

      if (!_oauthPopup || _oauthPopup.closed) {
        resetSocialButtons();
        window.location.href = url;
        return;
      }

      _oauthTimer = setInterval(() => {
        if (_oauthPopup && _oauthPopup.closed) {
          clearInterval(_oauthTimer);
          resetSocialButtons();
        }
      }, 500);
    }

    window.addEventListener('message', function(event) {
      if (event.origin !== window.location.origin) return;
      const { type, token, user, error } = event.data || {};
      clearInterval(_oauthTimer);
      if (_oauthPopup && !_oauthPopup.closed) _oauthPopup.close();

      const errEl = document.getElementById('authError');
      if (type === 'OAUTH_SUCCESS' && token && user) {
        localStorage.setItem('csToken', token);
        localStorage.setItem('csUser', JSON.stringify(user));
        if (errEl) {
          errEl.style.color = '#00ffaa'; errEl.style.borderColor = 'rgba(0,255,170,.3)'; errEl.style.background = 'rgba(0,255,170,.07)';
          errEl.textContent = `✅ Authenticated as ${user.name}! Entering workspace…`;
          errEl.classList.add('show');
        }
        setTimeout(() => { window.location.href = 'home.html'; }, 600);
      } else if (type === 'OAUTH_ERROR') {
        if (errEl) {
          errEl.style.color = ''; errEl.style.borderColor = ''; errEl.style.background = '';
          errEl.textContent = error || 'Authentication failed.';
          errEl.classList.add('show');
        }
        resetSocialButtons();
      }
    }, false);

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById('authError');
      const btn = document.getElementById('authSubmitBtn');
      errEl.classList.remove('show');

      const email = document.getElementById('inpEmail').value.trim();
      const password = document.getElementById('inpPassword').value;
      const name = document.getElementById('inpName').value.trim();

      if (!email || !password || (authMode === 'register' && !name)) {
        errEl.textContent = 'Please fill in all required fields.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = authMode === 'register' ? 'Creating account...' : 'Logging in...';

      const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
      const payload  = authMode === 'register' ? { name, email, password } : { email, password };

      try {
        const base = getApiBaseUrl();
        let r = null;
        try {
          r = await fetch((base ? base : '') + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch(e) {}

        if (!r || r.status === 405 || r.status === 404) {
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            r = await fetch('http://127.0.0.1:3088' + endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }
        }

        if (!r) throw new Error('Could not connect to authentication service.');
        const data = await r.json();

        if (!r.ok || !data.success) {
          if (authMode === 'login') {
            const errMsg = (data.error || '').toLowerCase();
            if (errMsg.includes('not found') || errMsg.includes('no user') ||
                errMsg.includes('invalid') || errMsg.includes('does not exist') ||
                r.status === 404 || r.status === 401) {
              errEl.style.cssText = 'background:rgba(248,104,104,0.12); border:1px solid rgba(248,104,104,0.4); color:#ff8080; padding:10px 14px; border-radius:8px; font-size:0.8rem; display:block; text-align:left; margin-bottom:12px;';
              errEl.innerHTML = '<strong>❌ You are not registered as a user for Cognisphere AI.</strong><br><span style="font-size:0.76rem; opacity:0.85;">Please create a new account to get started.</span>';
              btn.disabled = false;
              btn.textContent = 'Log in to Workspace →';
              return;
            }
          }
          throw new Error(data.error || 'Authentication failed. Please check your credentials.');
        }

        localStorage.setItem('csToken', data.token);
        localStorage.setItem('csUser', JSON.stringify(data.user));
        window.location.href = 'home.html';
      } catch(err) {
        errEl.style.cssText = '';
        errEl.innerHTML = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = authMode === 'register' ? 'Create Account & Enter Workspace →' : 'Log in to Workspace →';
      }
    }

    // ── 3D Starfield Background ──
    function init3DBackground() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas || !window.THREE) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 400;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const particleCount = 1200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const color1 = new THREE.Color(0x00ffaa);
      const color2 = new THREE.Color(0xd97757);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 1200;
        positions[i + 1] = (Math.random() - 0.5) * 1200;
        positions[i + 2] = (Math.random() - 0.5) * 1200;

        const c = Math.random() > 0.6 ? color1 : color2;
        colors[i] = c.r;
        colors[i + 1] = c.g;
        colors[i + 2] = c.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.6
      });

      const points = new THREE.Points(geometry, material);
      scene.add(points);

      function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.0006;
        points.rotation.x += 0.0003;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3DBackground();
      initGoogleIdentityServices();
    });
  </script>
