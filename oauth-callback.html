<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating — COGNISPHERE.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #07110d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #e0ffe8;
    }
    .card {
      background: linear-gradient(145deg, #0e1f17, #0b1810);
      border: 1px solid #1e3d2a;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 60px rgba(0, 255, 120, 0.08);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .logo-box {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0b1a14, #08120d);
      border: 2px solid #D97757;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 24px rgba(217, 119, 87, 0.3);
    }
    .logo-box svg { width: 38px; height: 38px; }

    h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: #00ffaa; letter-spacing: 0.08em; margin-bottom: 8px; }
    p { font-size: .875rem; color: #8ebc9e; margin-bottom: 24px; }

    /* Spinner */
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(0, 255, 170, 0.15);
      border-top-color: #00ffaa;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success */
    .icon-success { font-size: 3rem; margin-bottom: 12px; animation: pop .4s ease; }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Error */
    .error-box {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.3);
      border-radius: 10px;
      padding: 14px 18px;
      color: #ff8080;
      font-size: .85rem;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }
    .btn-retry {
      display: inline-block;
      background: linear-gradient(135deg, #00ffaa, #00cc88);
      color: #071a10;
      border: none;
      border-radius: 10px;
      padding: 10px 28px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn-retry:hover { opacity: .85; }
  </style>
</head>
<body>
<div class="card" id="card">
  <!-- Logo -->
  <div class="logo-box">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="20" rx="18" ry="8" stroke="#00ffaa" stroke-width="1.5" fill="none"/>
      <ellipse cx="20" cy="20" rx="18" ry="8" stroke="#00ffaa" stroke-width="1.5" fill="none" transform="rotate(60 20 20)"/>
      <ellipse cx="20" cy="20" rx="18" ry="8" stroke="#00ffaa" stroke-width="1.5" fill="none" transform="rotate(120 20 20)"/>
      <circle cx="20" cy="20" r="3.5" fill="#00ffaa"/>
    </svg>
  </div>

  <!-- Loading state (default) -->
  <div id="stateLoading">
    <div class="spinner"></div>
    <h1>AUTHENTICATING</h1>
    <p>Verifying your identity with COGNISPHERE.AI…</p>
  </div>

  <!-- Success state -->
  <div id="stateSuccess" style="display:none;">
    <div class="icon-success">✅</div>
    <h1>AUTHENTICATED</h1>
    <p>Welcome aboard! Redirecting you to your workspace…</p>
  </div>

  <!-- Error state -->
  <div id="stateError" style="display:none;">
    <div class="icon-success" style="font-size:2.5rem;">❌</div>
    <h1>AUTH FAILED</h1>
    <div class="error-box" id="errMsg" style="display:block;"></div>
    <a href="/" class="btn-retry">← Back to Login</a>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  const user   = params.get('user');
  const error  = params.get('error');

  function showState(state) {
    document.getElementById('stateLoading').style.display = 'none';
    document.getElementById('stateSuccess').style.display = 'none';
    document.getElementById('stateError').style.display   = 'none';
    document.getElementById(state).style.display = 'block';
  }

  if (error) {
    showState('stateError');
    document.getElementById('errMsg').textContent = decodeURIComponent(error);
    // If opened as a popup, send error to parent and close
    if (window.opener) {
      window.opener.postMessage({ type: 'OAUTH_ERROR', error: decodeURIComponent(error) }, window.location.origin);
      setTimeout(() => window.close(), 2500);
    }
    return;
  }

  if (token && user) {
    showState('stateSuccess');
    try {
      const parsedUser = JSON.parse(decodeURIComponent(user));
      localStorage.setItem('csToken', token);
      localStorage.setItem('csUser', JSON.stringify(parsedUser));

      // If opened as a popup, notify parent window and close
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'OAUTH_SUCCESS', token, user: parsedUser }, window.location.origin);
        setTimeout(() => window.close(), 1200);
      } else {
        // Direct navigation (not popup) — go straight to app
        setTimeout(() => { window.location.href = '/index.html'; }, 1000);
      }
    } catch(e) {
      showState('stateError');
      document.getElementById('errMsg').textContent = 'Failed to parse authentication data. Please try again.';
    }
    return;
  }

  // No token and no error — something went wrong
  showState('stateError');
  document.getElementById('errMsg').textContent = 'No authentication data received. The OAuth flow may have been interrupted.';
  if (window.opener) {
    window.opener.postMessage({ type: 'OAUTH_ERROR', error: 'No auth data received' }, window.location.origin);
    setTimeout(() => window.close(), 2500);
  }
})();
</script>
</body>
</html>
