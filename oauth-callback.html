<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating — Cognisphere AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070809;
      color: #f0ede8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .auth-box {
      text-align: center;
      padding: 32px 40px;
      background: rgba(18, 22, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      max-width: 400px;
      width: 90%;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(0, 255, 170, 0.2);
      border-top-color: #00ffaa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    p {
      font-size: 0.85rem;
      color: #8c8780;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="spinner"></div>
    <h2 id="authHeading">Authenticating...</h2>
    <p id="authMsg">Connecting your account to Cognisphere AI</p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const userStr = params.get('user');
      const error = params.get('error');

      const heading = document.getElementById('authHeading');
      const msg = document.getElementById('authMsg');

      if (token && userStr) {
        try {
          const user = JSON.parse(decodeURIComponent(userStr));
          localStorage.setItem('csToken', token);
          localStorage.setItem('csUser', JSON.stringify(user));
          
          heading.textContent = 'Welcome back!';
          msg.textContent = 'Redirecting to workspace...';

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'OAUTH_SUCCESS', token, user }, window.location.origin);
            setTimeout(() => { window.close(); }, 400);
          } else {
            setTimeout(() => { window.location.href = '/home.html'; }, 500);
          }
        } catch (e) {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'OAUTH_ERROR', error: e.message }, window.location.origin);
            setTimeout(() => { window.close(); }, 400);
          } else {
            window.location.href = '/home.html';
          }
        }
      } else if (error) {
        heading.textContent = 'Authentication Failed';
        msg.textContent = error;
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'OAUTH_ERROR', error }, window.location.origin);
          setTimeout(() => { window.close(); }, 1500);
        } else {
          setTimeout(() => { window.location.href = '/index.html'; }, 2000);
        }
      } else {
        window.location.href = '/index.html';
      }
    })();
  </script>
</body>
</html>
