<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates · Kummitha Abhiram Reddy</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090e; --surface:#111118; --ink:#e8e6f0; --muted:#6a6878;
  --dim:#2e2c3a; --a1:#c8f135; --a2:#7b61ff; --a3:#ff5e3a; --a4:#00d4aa; --a5:#f5a623;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:var(--a1);color:#09090e;}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}
.reveal.in{opacity:1;transform:none;}
.reveal.d1{transition-delay:.1s;}.reveal.d2{transition-delay:.2s;}.reveal.d3{transition-delay:.3s;}
.page-home-btn{background:none;border:1px solid var(--dim);color:var(--ink);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .2s;text-decoration:none;flex-shrink:0;}
.page-home-btn:hover{border-color:var(--a1);color:var(--a1);transform:scale(1.06);}
.acad-back{background:none;border:1px solid var(--dim);color:var(--ink);width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .2s;}
.acad-back:hover{border-color:var(--a1);color:var(--a1);transform:translateX(-2px);}

/* ===== Shared compact-shell layout (also used by the Academics page) ===== */
.acad-shell{width:100%;max-width:640px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;}
.acad-topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:14px 18px;background:rgba(9,9,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--dim);}
.nav-logo-link{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid var(--dim);flex-shrink:0;display:block;transition:border-color .2s;}
.nav-logo-link:hover{border-color:var(--a1);}
.nav-logo-img{width:100%;height:100%;object-fit:cover;display:block;}
.acad-title{font-family:'Instrument Serif',serif;font-size:16px;color:var(--ink);flex:1;transition:opacity .2s ease;}
.acad-close{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;width:28px;height:28px;transition:color .2s,transform .2s;}
.acad-body{padding:18px 18px 44px;transition:opacity .28s ease, transform .28s ease;will-change:opacity,transform;}

/* ===== Certificates page styles (moved out of index.html) ===== */
/* Certificates overlay */
#certificatesOverlay{display:none;position:fixed;inset:0;z-index:600;width:100vw;height:100vh;background:var(--bg);overflow-y:auto;overflow-x:hidden;-ms-overflow-style:none;scrollbar-width:none;}
#certificatesOverlay::-webkit-scrollbar{display:none;}
#certificatesOverlay.open{display:block;}
.cert-search-wrap{flex-shrink:0;}
.cert-search-wrap input{width:118px;background:var(--bg);border:1px solid var(--dim);border-radius:20px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink);outline:none;transition:border-color .2s,width .2s;}
.cert-search-wrap input:focus{border-color:var(--a1);width:160px;}
.cert-search-wrap input::placeholder{color:var(--muted);}
.cert-search-noresult{display:none;text-align:center;padding:60px 8px;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;}
.cert-search-noresult.show{display:block;}


/* ===== New grid gallery model (replaces long-form list) ===== */
.cert-group{margin-bottom:34px;}
.cert-group-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding-left:2px;}
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;}
.cert-group[data-group="images"] .cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;}
.cert-group[data-group="pdfs"] .cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;}
@media (max-width:768px){
  .cert-grid,
  .cert-group[data-group="images"] .cert-grid,
  .cert-group[data-group="pdfs"] .cert-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
}
@media (max-width:480px){
  .cert-grid,
  .cert-group[data-group="images"] .cert-grid,
  .cert-group[data-group="pdfs"] .cert-grid{grid-template-columns:repeat(3,1fr);gap:6px;}
  .cert-thumb{max-height:100px;}
  .cert-thumb-pdf{max-height:none;}
  .cert-tile-title{font-size:8px;}
}
.cert-tile{display:flex;flex-direction:column;gap:4px;background:none;border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;color:inherit;max-width:100%;}
.cert-thumb{position:relative;aspect-ratio:3/4;width:100%;max-height:150px;border-radius:8px;overflow:hidden;border:1px solid var(--dim);background:var(--surface);transition:border-color .2s,transform .2s;}
.cert-tile-title{font-size:9px;line-height:1.3;color:var(--ink);}
@media (hover:hover) and (pointer:fine){
  .cert-tile:hover .cert-thumb{border-color:var(--a5);transform:translateY(-2px);}
}
.cert-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.cert-thumb-pdf{aspect-ratio:1/1;max-height:none;background:#fff;display:flex;align-items:center;justify-content:center;}
.cert-thumb-pdf canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;}
.cert-thumb-pdf::after{content:'PDF';position:absolute;bottom:6px;right:6px;background:var(--a3);color:#09090e;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;font-weight:600;padding:2px 6px;border-radius:3px;z-index:1;}
.cert-pdf-download-btn{position:absolute;bottom:6px;left:6px;z-index:2;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;width:22px;height:22px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.cert-pdf-download-btn:hover{background:rgba(0,0,0,.8);}
.cert-thumb-pdf .cert-pdf-loading{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.cert-tile.cert-hide{display:none;}
.cert-group.cert-hide{display:none;}

/* Lightbox — fullscreen photo-viewer style, not a card */
.cert-lightbox{display:none;position:fixed;inset:0;z-index:900;background:#000;overflow:hidden;overscroll-behavior:contain;}
.cert-lightbox.open{display:block;}
.cert-lightbox-topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:14px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.cert-lightbox-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cert-lightbox-download{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;}
.cert-lightbox-download:hover{background:rgba(255,255,255,.2);}
.cert-lightbox-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;}
.cert-lightbox-close:hover{background:rgba(255,255,255,.2);}
.cert-lightbox-title{z-index:2;font-family:'Instrument Serif',serif;font-size:15px;font-weight:400;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cert-lightbox-body{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;}
.cert-lightbox-body img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;}
.cert-lightbox-body iframe{width:100%;height:100%;border:none;background:#fff;display:block;}
.cert-lightbox-pdf{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#000;display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 0 max(24px,env(safe-area-inset-bottom));}
.cert-lightbox-pdf canvas{max-width:96%;height:auto;box-shadow:0 4px 22px rgba(0,0,0,.5);background:#fff;}
.cert-lightbox-pdf-loading{color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;padding:40px 0;}

/* ===== Academics / Personal division toggle ===== */
.cert-div-toggle-row{display:flex;justify-content:center;padding:12px 14px 0;}
.cert-div-toggle{position:relative;display:inline-flex;background:var(--surface);border:1px solid var(--dim);border-radius:999px;padding:2px;gap:2px;}
.cert-div-toggle-thumb{position:absolute;top:2px;left:2px;bottom:2px;width:calc(50% - 2px);background:var(--ink);border:1px solid var(--ink);border-radius:999px;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:0;}
.cert-div-toggle[data-active="personal"] .cert-div-toggle-thumb{transform:translateX(100%);}
.cert-div-btn{position:relative;z-index:1;border:none;background:none;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:5px 13px;border-radius:999px;cursor:pointer;transition:color .25s;white-space:nowrap;}
.cert-div-btn.active{color:#09090e;}
.cert-division{display:none;}
.cert-division.active{display:block;}

/* ===== Personal-only: merge title line onto the card image (grid tile) ===== */
.cert-division[data-division="personal"] .cert-tile{position:relative;}
.cert-division[data-division="personal"] .cert-tile-title{
  position:absolute;top:0;left:0;right:0;margin:0;z-index:2;
  padding:6px 7px 16px;
  background:linear-gradient(to bottom, rgba(0,0,0,.74), rgba(0,0,0,0));
  color:#fff;font-size:8.5px;line-height:1.25;
}

/* ===== Personal-only: merge title line onto the card image (lightbox) ===== */
.cert-lightbox-imgwrap{position:relative;display:inline-flex;max-width:100%;max-height:100%;}
.cert-lightbox-imgwrap img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
.cert-lightbox-caption{position:absolute;top:0;left:0;right:0;z-index:1;pointer-events:none;
  padding:16px 18px 30px;
  background:linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,0));
  color:#fff;font-family:'Instrument Serif',serif;font-size:15px;font-weight:400;
  text-shadow:0 1px 6px rgba(0,0,0,.7);
}
.cert-lightbox.personal-mode .cert-lightbox-title{visibility:hidden;}
</style>
</head>

            <span class="cert-thumb cert-thumb-pdf"><canvas class="cert-pdf-canvas"></canvas><button class="cert-pdf-download-btn" type="button" aria-label="Download" title="Download" data-src="study_certificates.pdf" data-title="Study & Admission Certificates">⬇</button></span>
            <span class="cert-tile-title">Study & Admission Certificates</span>
          </div>
          <div class="cert-tile" tabindex="0" role="button" data-type="pdf" data-src="hall_tickets.pdf" data-title="Study & Hall Tickets">
            <span class="cert-thumb cert-thumb-pdf"><canvas class="cert-pdf-canvas"></canvas><button class="cert-pdf-download-btn" type="button" aria-label="Download" title="Download" data-src="hall_tickets.pdf" data-title="Study & Hall Tickets">⬇</button></span>
            <span class="cert-tile-title">Study & Hall Tickets</span>
          </div>
        </div>
      </section>
    </div>
    <div class="cert-division" data-division="personal">
      <section class="cert-group reveal" data-group="images">
        <p class="cert-group-label">Images</p>
        <div class="cert-grid">
          <button class="cert-tile" type="button" data-type="image" data-src="Abhi_aadhaar_card.jpg" data-title="Abhiram Reddy Aadhaar Card">
            <span class="cert-thumb"><img src="Abhi_aadhaar_card.jpg" alt="Abhiram Reddy Aadhaar Card" loading="lazy"></span>
            <span class="cert-tile-title">Abhiram Reddy Aadhaar Card</span>
          </button>
        </div>
      </section>

      <section class="cert-group reveal d1" data-group="pdfs">
        <p class="cert-group-label">PDFs</p>
        <div class="cert-grid">
          <div class="cert-tile" tabindex="0" role="button" data-type="pdf" data-src="AADHAAR_CARDS.pdf" data-title="Aadhaar Cards (Family)">
            <span class="cert-thumb cert-thumb-pdf"><canvas class="cert-pdf-canvas"></canvas><button class="cert-pdf-download-btn" type="button" aria-label="Download" title="Download" data-src="AADHAAR_CARDS.pdf" data-title="Aadhaar Cards (Family)">⬇</button></span>
            <span class="cert-tile-title">Aadhaar Cards (Family)</span>
          </div>
        </div>
      </section>
    </div>

      <p class="cert-search-noresult" id="certNoResult">No certificates match your search.</p>
    </div>

    <div class="cert-lightbox" id="certLightbox">
      <div class="cert-lightbox-topbar">
        <div class="cert-lightbox-title" id="certLightboxTitle"></div>
        <div class="cert-lightbox-controls">
          <button class="cert-lightbox-download" id="certLightboxDownload" type="button" aria-label="Download" title="Download">⬇</button>
          <button class="cert-lightbox-close" id="certLightboxClose" type="button" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="cert-lightbox-body" id="certLightboxBody"></div>
    </div>
  </div>

</div>

<script>
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('failed to load '+src));
    document.head.appendChild(s);
  });
}
// Try a few CDNs in order, since a single blocked/flaky host shouldn't kill the PDF viewer.
const PDFJS_SOURCES = [
  { lib:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js', worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js' },
  { lib:'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js', worker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.js' },
  { lib:'https://unpkg.com/pdfjs-dist@4.0.379/build/pdf.min.js', worker:'https://unpkg.com/pdfjs-dist@4.0.379/build/pdf.worker.min.js' }
];
window.pdfjsReady = (async function(){
  for(const src of PDFJS_SOURCES){
    try{
      await loadScriptOnce(src.lib);
      if(window['pdfjsLib']){
        pdfjsLib.GlobalWorkerOptions.workerSrc = src.worker;
        return true;
      }
    }catch(err){ /* try the next CDN */ }
  }
  return false;
})();
</script>
<script>

// Fade/slide the reveal-tagged sections in as they scroll into view.
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
}, {threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

// Academics / Personal division toggle (elliptical pill, Academics shown by default).
const certDivToggle = document.getElementById('certDivToggle');
const certDivButtons = certDivToggle ? certDivToggle.querySelectorAll('.cert-div-btn') : [];
function setDivision(division){
  certDivToggle.dataset.active = division;
  certDivButtons.forEach(btn=>{
    const isActive = btn.dataset.division === division;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  document.querySelectorAll('.cert-division').forEach(div=>{
    div.classList.toggle('active', div.dataset.division === division);
  });
  filterCertificates(certOverlaySearch ? certOverlaySearch.value : '');
}
certDivButtons.forEach(btn=>{
  btn.addEventListener('click', ()=> setDivision(btn.dataset.division));
});

// Swipe left/right anywhere in the body — including over the images and PDFs rows — to switch Academics <-> Personal.
const certificatesWrap = document.getElementById('certificates-wrap');
const DIVISION_ORDER = ['academics', 'personal'];
if(certificatesWrap){
  let swipeStartX = 0, swipeStartY = 0, swipeActive = false;
  certificatesWrap.addEventListener('touchstart', (e)=>{
    swipeActive = true;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, {passive:true});
  certificatesWrap.addEventListener('touchend', (e)=>{
    if(!swipeActive) return;
    swipeActive = false;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    const current = certDivToggle.dataset.active;
    const idx = DIVISION_ORDER.indexOf(current);
    if(dx < 0 && idx < DIVISION_ORDER.length - 1){
      setDivision(DIVISION_ORDER[idx + 1]);
    } else if(dx > 0 && idx > 0){
      setDivision(DIVISION_ORDER[idx - 1]);
    }
  });
}

// Search box: filters certificate tiles within the active division only.
const certOverlaySearch = document.getElementById('certOverlaySearch');
const certNoResult = document.getElementById('certNoResult');
function filterCertificates(query){
  const q = query.trim().toLowerCase();
  const activeDivision = document.querySelector('.cert-division.active');
  let anyVisible = false;
  document.querySelectorAll('.cert-division').forEach(division=>{
    const isActiveDivision = division === activeDivision;
    division.querySelectorAll('.cert-group').forEach(group=>{
      let groupHasMatch = false;
      group.querySelectorAll('.cert-tile').forEach(tile=>{
        const text = (tile.dataset.title || '').toLowerCase();
        const match = q === '' || text.includes(q);
        tile.classList.toggle('cert-hide', !match);
        if(match && isActiveDivision){ groupHasMatch = true; anyVisible = true; }
      });
      group.classList.toggle('cert-hide', isActiveDivision && !groupHasMatch);
    });
  });
  if(certNoResult) certNoResult.classList.toggle('show', !anyVisible && q !== '');
}
if(certOverlaySearch) certOverlaySearch.addEventListener('input', (e)=> filterCertificates(e.target.value));

// Lightbox: clicking any tile opens its image/PDF directly, full size.
const certLightbox = document.getElementById('certLightbox');
const certLightboxTitle = document.getElementById('certLightboxTitle');
const certLightboxBody = document.getElementById('certLightboxBody');
const certLightboxClose = document.getElementById('certLightboxClose');
const certLightboxDownload = document.getElementById('certLightboxDownload');
let currentLightboxSrc = '';
let currentLightboxTitle = '';

function downloadCert(){
  if(!currentLightboxSrc) return;
  const a = document.createElement('a');
  a.href = currentLightboxSrc;
  a.download = currentLightboxTitle || 'certificate';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ---- PDF thumbnails: render the entire first page onto a canvas so the ----
// ---- full certificate shows on the card, just like the image tiles.   ----
const pdfDocCache = new Map(); // src -> loadingTask promise, so we don't refetch the same file twice
function getPdfDoc(src){
  if(!pdfDocCache.has(src)) pdfDocCache.set(src, pdfjsLib.getDocument(src).promise);
  return pdfDocCache.get(src);
}
async function renderPdfThumb(tile){
  const canvas = tile.querySelector('.cert-pdf-canvas');
  if(!canvas) return;
  const ready = await window.pdfjsReady;
  if(!ready) return;
  try{
    const pdf = await getPdfDoc(tile.dataset.src);
    const page = await pdf.getPage(1);
    const box = canvas.parentElement.getBoundingClientRect();
    const targetW = (box.width || 150) * 2;   // 2x for crisp retina thumbs
    const targetH = (box.height || 150) * 2;
    const base = page.getViewport({scale:1});
    const scale = Math.min(targetW / base.width, targetH / base.height);
    const viewport = page.getViewport({scale});
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport}).promise;
  }catch(err){
    console.error('PDF thumb render failed for', tile.dataset.src, err);
  }
}
document.querySelectorAll('.cert-tile[data-type="pdf"]').forEach(renderPdfThumb);

// ---- PDF lightbox: render every page into the same in-page lightbox   ----
// ---- used for images, so PDFs never leave the site / open a new tab. ----
async function renderPdfInLightbox(src){
  certLightboxBody.innerHTML = '<div class="cert-lightbox-pdf" id="certLightboxPdf"><p class="cert-lightbox-pdf-loading">Loading…</p></div>';
  const container = document.getElementById('certLightboxPdf');
  const ready = await window.pdfjsReady;
  if(!ready){
    container.innerHTML = '<p class="cert-lightbox-pdf-loading">Couldn\'t load PDF viewer. Check your connection and try again. <a href="'+src+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline;">Open PDF directly</a></p>';
    return;
  }
  try{
    const pdf = await getPdfDoc(src);
    container.innerHTML = '';
    const containerWidth = certLightboxBody.clientWidth || window.innerWidth;
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const base = page.getViewport({scale:1});
      const scale = (containerWidth * 0.96 * 2) / base.width; // 2x for crisp retina render
      const viewport = page.getViewport({scale});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      container.appendChild(canvas);
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    }
  }catch(err){
    console.error('PDF lightbox render failed for', src, err);
    container.innerHTML = '<p class="cert-lightbox-pdf-loading">Couldn\'t load this PDF.</p>';
  }
}

function openCertLightbox(tile){
  const type = tile.dataset.type;
  const src = tile.dataset.src;
  const title = tile.dataset.title || '';
  if(type === 'pdf'){
    window.open(src, '_blank', 'noopener');
    return;
  }
  const divisionEl = tile.closest('.cert-division');
  const isPersonal = divisionEl && divisionEl.dataset.division === 'personal';
  currentLightboxSrc = src;
  currentLightboxTitle = title;
  certLightboxTitle.textContent = title;
  certLightbox.classList.add('open');
  certLightbox.classList.toggle('personal-mode', isPersonal);
  if(isPersonal){
    certLightboxBody.innerHTML = `<div class="cert-lightbox-imgwrap"><span class="cert-lightbox-caption">${title}</span><img src="${src}" alt="${title}"></div>`;
  } else {
    certLightboxBody.innerHTML = `<img src="${src}" alt="${title}">`;
  }
}
function closeCertLightbox(){
  certLightbox.classList.remove('open');
  certLightbox.classList.remove('personal-mode');
  certLightboxBody.innerHTML = '';
  certLightboxBody.style.transform = '';
  certLightboxBody.style.transition = '';
  certLightbox.style.background = '';
  currentLightboxSrc = '';
  currentLightboxTitle = '';
}
document.querySelectorAll('.cert-tile').forEach(tile=>{
  tile.addEventListener('click', ()=> openCertLightbox(tile));
  if(tile.getAttribute('role') === 'button'){
    tile.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openCertLightbox(tile);
      }
    });
  }
});
function downloadFile(src, title){
  const a = document.createElement('a');
  a.href = src;
  a.download = title || 'certificate';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
document.querySelectorAll('.cert-pdf-download-btn').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    downloadFile(btn.dataset.src, btn.dataset.title);
  });
});
if(certLightboxDownload) certLightboxDownload.addEventListener('click', downloadCert);
if(certLightboxClose) certLightboxClose.addEventListener('click', closeCertLightbox);


// Swipe-down-to-dismiss on the image, like a native mobile photo viewer.
let touchStartY = 0, touchDeltaY = 0, touching = false;
if(certLightboxBody){
  certLightboxBody.addEventListener('touchstart', (e)=>{
    if(!certLightboxBody.querySelector('img')) return;
    touching = true;
    touchStartY = e.touches[0].clientY;
    certLightboxBody.style.transition = 'none';
  }, {passive:true});
  certLightboxBody.addEventListener('touchmove', (e)=>{
    if(!touching) return;
    touchDeltaY = e.touches[0].clientY - touchStartY;
    if(touchDeltaY > 0){
      certLightboxBody.style.transform = `translateY(${touchDeltaY}px)`;
      certLightbox.style.background = `rgba(0,0,0,${Math.max(0.4, 1 - touchDeltaY/400)})`;
    }
  }, {passive:true});
  certLightboxBody.addEventListener('touchend', ()=>{
    if(!touching) return;
    touching = false;
    certLightboxBody.style.transition = 'transform .25s ease';
    if(touchDeltaY > 120){
      closeCertLightbox();
    } else {
      certLightboxBody.style.transform = 'translateY(0)';
      certLightbox.style.background = '#000';
    }
    touchDeltaY = 0;
  });
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    if(certLightbox && certLightbox.classList.contains('open')) closeCertLightbox();
    else window.location.href = 'index.html';
  }
});
</script>
